<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Placestruct</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">▤</div>
      <div>
        <strong>Placestruct</strong>
        <span>Proste, czytelne instrukcje</span>
      </div>
    </div>
    <div class="top-actions">
      <div class="customize-wrap">
        <button class="ghost" id="customizeBtn">🎨 Wygląd</button>
        <div class="customize-panel" id="customizePanel" hidden>
          <label>Kolor numerków kroków</label>
          <input type="color" id="badgeColorInput" value="#2563eb">
          <label>Kształt numerków</label>
          <div class="shape-options">
            <button type="button" class="shape-btn" data-shape="square" title="Kwadrat"><span class="shape-preview"></span></button>
            <button type="button" class="shape-btn" data-shape="rounded" title="Zaokrąglony"><span class="shape-preview"></span></button>
            <button type="button" class="shape-btn" data-shape="circle" title="Koło"><span class="shape-preview"></span></button>
            <button type="button" class="shape-btn" data-shape="diamond" title="Diament"><span class="shape-preview"></span></button>
            <button type="button" class="shape-btn" data-shape="hexagon" title="Sześciokąt"><span class="shape-preview"></span></button>
            <button type="button" class="shape-btn" data-shape="pentagon" title="Pięciokąt"><span class="shape-preview"></span></button>
            <button type="button" class="shape-btn" data-shape="octagon" title="Ośmiokąt"><span class="shape-preview"></span></button>
            <button type="button" class="shape-btn" data-shape="star" title="Gwiazda"><span class="shape-preview"></span></button>
            <button type="button" class="shape-btn" data-shape="triangle" title="Trójkąt"><span class="shape-preview"></span></button>
          </div>
          <label>Rozmiar czcionki <span id="fontScaleValue">100%</span></label>
          <input type="range" id="fontScaleInput" min="80" max="150" step="5" value="100">
          <label>Układ wielu zdjęć w kroku</label>
          <div class="layout-options">
            <button type="button" class="layout-btn" data-layout="stack">Jedno pod drugim</button>
            <button type="button" class="layout-btn" data-layout="row">Obok siebie</button>
          </div>
          <button type="button" class="ghost reset-badge-btn" id="resetBadgeBtn">Przywróć domyślne</button>
        </div>
      </div>
      <button class="ghost theme-btn" id="themeBtn">☾ Ciemny</button><button class="ghost" id="newBtn">Nowa</button><button class="ghost" id="clearBtn">Wyczyść</button>
      <button class="primary" id="printBtn">🖨 Drukuj</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="editor">
      <div class="panel-title">
        <div>
          <span class="eyebrow">EDYTOR</span>
          <h1>Twoja instrukcja</h1>
        </div>
        <span class="save-state" id="saveState">Zapisano</span>
      </div>

      <section class="library-section" id="librarySection" hidden>
        <div class="section-heading">
          <div>
            <span class="eyebrow">ZAPISANE</span>
            <h2>Poprzednie instrukcje</h2>
          </div>
        </div>
        <div id="libraryList" class="library-list"></div>
      </section>

      <section class="form-section">
        <label>Etykieta nad tytułem <span>(opcjonalnie)</span></label>
        <input id="docKicker" value="Instrukcja krok po kroku" placeholder="Np. Instrukcja krok po kroku">

        <label>Tytuł instrukcji</label>
        <input id="docTitle" value="Jak zmienić hasło Wi-Fi" placeholder="Np. Jak zmienić hasło Wi-Fi">

        <label>Krótki opis <span>(opcjonalnie)</span></label>
        <textarea id="docIntro" rows="3" placeholder="Jedno lub dwa zdania wyjaśniające, czego dotyczy instrukcja.">Instrukcja krok po kroku dla osób, które po raz pierwszy wykonują tę czynność.</textarea>
      </section>

      <section class="steps-section">
        <div class="section-heading">
          <div>
            <span class="eyebrow">KROKI</span>
            <h2>Treść instrukcji</h2>
          </div>
          <button class="small-add" id="addStepBtn">＋ Krok</button>
        </div>
        <div id="steps"></div>
      </section>
    </aside>

    <section class="preview-area">
      <div class="preview-toolbar">
        <span>Podgląd dokumentu</span>
        <div class="preview-mode">
          <button type="button" class="mode-btn" id="modeSingleBtn">Pojedyncza</button>
          <button type="button" class="mode-btn" id="modeAllBtn">Wszystkie</button>
        </div>
        <span class="a4-badge">A4 · podgląd druku</span>
      </div>
      <div class="paper-wrap" id="paperWrap">
        <article class="paper" id="paper"></article>
      </div>
    </section>
  </main>

  <template id="stepTemplate">
    <div class="step-card">
      <div class="step-head">
        <div class="step-number"></div>
        <input class="step-title" placeholder="Tytuł kroku">
        <button class="icon-btn toggle-step" title="Zwiń/rozwiń krok">▾</button>
        <button class="icon-btn move-up" title="Przenieś wyżej">↑</button>
        <button class="icon-btn move-down" title="Przenieś niżej">↓</button>
        <button class="icon-btn delete-step" title="Usuń krok">×</button>
      </div>
      <div class="text-toolbar">
        <button type="button" class="fmt-btn" data-cmd="bold" title="Pogrubienie"><b>B</b></button>
        <button type="button" class="fmt-btn" data-cmd="italic" title="Kursywa"><i>I</i></button>
        <span class="fmt-divider"></span>
        <button type="button" class="color-swatch" data-color="#3f4b58" title="Domyślny" style="background:#3f4b58"></button>
        <button type="button" class="color-swatch" data-color="#c0392b" title="Czerwony" style="background:#c0392b"></button>
        <button type="button" class="color-swatch" data-color="#b8860b" title="Pomarańczowy" style="background:#b8860b"></button>
        <button type="button" class="color-swatch" data-color="#3f9153" title="Zielony" style="background:#3f9153"></button>
        <button type="button" class="color-swatch" data-color="#2563eb" title="Niebieski" style="background:#2563eb"></button>
        <button type="button" class="color-swatch" data-color="#7c3aed" title="Fioletowy" style="background:#7c3aed"></button>
      </div>
      <div class="step-text" contenteditable="true" data-placeholder="Opisz krótko, co użytkownik ma zrobić..."></div>

      <div class="image-box">
        <input class="image-input" type="file" accept="image/png,image/jpeg,image/webp" hidden multiple>
        <div class="image-placeholder">
          <button class="upload-btn">＋ Dodaj zdjęcie</button>
          <small>PNG, JPG lub WebP — albo wklej</small>
        </div>
        <div class="image-list"></div>
        <button type="button" class="ghost add-more-images" hidden>＋ Dodaj kolejne zdjęcie</button>
        <small class="add-more-hint" hidden>...albo kliknij gdziekolwiek w tym kroku i wklej (Ctrl+V)</small>
      </div>

      <div class="special-row">
        <div class="callout-list"></div>
        <button type="button" class="ghost add-callout-btn">＋ Dodaj wyróżnienie</button>
      </div>
    </div>
  </template>

  <template id="calloutEntryTemplate">
    <div class="callout-entry">
      <div class="callout-entry-row">
        <select class="callout-type">
          <option value="tip">💡 Wskazówka</option>
          <option value="warning">⚠️ Uwaga</option>
          <option value="info">ℹ️ Informacja</option>
          <option value="important">❗ Ważne</option>
        </select>
        <button type="button" class="icon-btn remove-callout" title="Usuń wyróżnienie">×</button>
      </div>
      <input class="callout-text" placeholder="Treść wyróżnienia...">
    </div>
  </template>

  <template id="imageEntryTemplate">
    <div class="image-entry">
      <img>
      <div class="image-scale-row">
        <label>Rozmiar zdjęcia <span class="scale-value">100%</span></label>
        <input type="range" class="scale-input" min="20" max="100" step="5" value="100">
      </div>
      <div class="image-controls">
        <input class="caption-input" placeholder="Podpis zdjęcia (opcjonalnie)">
        <button class="move-image-up" title="Przenieś wyżej">↑</button>
        <button class="move-image-down" title="Przenieś niżej">↓</button>
        <button class="remove-image">Usuń</button>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
